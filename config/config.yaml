seed: 42
io:
  data_dir: data
  artifacts_dir: artifacts
files:
  extraction: ["Extraction.xlsx", "*Extraction*.xlsx"]
  completeness: ["Project completeness.xlsx", "*Project*completeness*.xlsx"]
  digital: ["Digital index.xlsx", "*Digital*index*.xlsx"]
  iri: ["Codificated IRI + Transparency.xlsx", "*Codificated*IRI*Transparency*.xlsx"]
ml:
  test_size: 0.20
  cv_n_splits: 5
  cv_n_repeats: 2
  calibrate: true
  calibration: sigmoid
  rare_min_freq: 30
features:
