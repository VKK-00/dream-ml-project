# --- Ruff ---
[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["data", "artifacts", ".venv"]

[tool.ruff.lint]
# Choose the rule sets you want:
select = ["E", "F", "B", "I"]
ignore = []

# Ignore noisy rules on the notebook file specifically
per-file-ignores = { "notebooks/code.ipynb" = ["E402", "E702", "F821"] }

# --- Black ---
[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$|\.ipynb$'
skip-string-normalization = false
