[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["data", "artifacts", ".venv", "notebooks/*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
ignore = []

[tool.black]
line-length = 120
target-version = ["py311"]
include = '\.pyi?$|\.ipynb$'
skip-string-normalization = false
